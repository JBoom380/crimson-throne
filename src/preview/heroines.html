<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heroine Preview</title>
<style>
  html, body { margin:0; height:100%; background:#050203; overflow:hidden; }
  #gl { position:absolute; left:0; top:0; width:100vw; height:100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  #info { position:absolute; left:8px; bottom:6px; color:#c8a070; font:12px monospace; text-shadow:0 1px 2px #000; white-space:pre; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="info"></div>
<script src="../vendor/three.global.js"></script>
<script src="../heroines.js"></script>
<script>
(function () {
  const T = THREE, Q = new URLSearchParams(location.search);
  const RAW = Q.get('raw') === '1';
  const PW = RAW ? 1280 : 640, PH = RAW ? 720 : 360;
  const canvas = document.getElementById('gl');
  const renderer = new T.WebGLRenderer({ canvas, antialias: RAW, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1); renderer.setSize(PW, PH, false);
  renderer.outputColorSpace = T.LinearSRGBColorSpace;
  // same post pass as game.js (640x360 HalfFloat target, Frazetta grade, Bayer dither, 18-level posterise)
  const rt = new T.WebGLRenderTarget(PW, PH, { minFilter: T.NearestFilter, magFilter: T.NearestFilter, type: T.HalfFloatType });
  const postScene = new T.Scene(), postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new T.ShaderMaterial({
    uniforms: { tDiffuse: { value: rt.texture }, uFade: { value: 1 }, uHurt: { value: 0 }, uLow: { value: 0 }, uTime: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uFade, uHurt, uLow, uTime; varying vec2 vUv;
      float bayer(vec2 p){ int x=int(mod(p.x,4.0)), y=int(mod(p.y,4.0)); int i=x+y*4;
        float m[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
        for(int k=0;k<16;k++) if(k==i) return m[k]/16.0-0.5; return 0.0; }
      vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        c = aces(c * 1.1);
        c = pow(c, vec3(1.0/2.2));
        float l = dot(c, vec3(0.299,0.587,0.114));
        c *= mix(vec3(1.06,0.90,0.88), vec3(1.02,0.99,0.94), smoothstep(0.0, 0.7, l));
        c = mix(vec3(l), c, 1.22);
        vec2 d = vUv - 0.5; float v = dot(d, d);
        c *= 1.0 - v * 0.9;
        float pulse = 0.6 + 0.4 * sin(uTime * 6.0);
        c = mix(c, vec3(dot(c, vec3(0.33))) * vec3(1.0,0.6,0.55), uLow * 0.45);
        c = mix(c, vec3(0.55,0.0,0.02), clamp(v * 3.2 * (uHurt + uLow * 0.5 * pulse), 0.0, 0.85));
        c += bayer(gl_FragCoord.xy) / 18.0;
        c = floor(c * 18.0 + 0.5) / 18.0;
        gl_FragColor = vec4(c * uFade, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  postScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), postMat));

  // dusk scene
  const scene = new T.Scene();
  const sky = new T.Mesh(new T.SphereGeometry(60, 32, 16), new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec3 vP; void main(){ float h = normalize(vP).y;
      vec3 top = vec3(0.006,0.002,0.012), mid = vec3(0.035,0.006,0.028), hor = vec3(0.16,0.03,0.022);
      vec3 c = mix(hor, mid, smoothstep(-0.02, 0.18, h)); c = mix(c, top, smoothstep(0.18, 0.7, h));
      c = mix(c, vec3(0.02,0.008,0.012), smoothstep(0.0, -0.2, h)); gl_FragColor = vec4(c, 1.0); }`,
  }));
  scene.add(sky);
  const gcv = document.createElement('canvas'); gcv.width = gcv.height = 256; const gx = gcv.getContext('2d');
  gx.fillStyle = '#4a3c36'; gx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 70; i++) { gx.fillStyle = ['#3a2e2a', '#5a4a42', '#2e2420'][i % 3]; gx.beginPath(); gx.arc(Math.random() * 256, Math.random() * 256, 8 + Math.random() * 22, 0, 7); gx.fill(); }
  gx.strokeStyle = '#1c1412'; gx.lineWidth = 3; for (let i = 0; i < 12; i++) { gx.beginPath(); gx.moveTo(Math.random() * 256, Math.random() * 256); gx.lineTo(Math.random() * 256, Math.random() * 256); gx.stroke(); }
  const gtex = new T.CanvasTexture(gcv); gtex.colorSpace = T.SRGBColorSpace; gtex.wrapS = gtex.wrapT = T.RepeatWrapping; gtex.repeat.set(3, 3);
  const ground = new T.Mesh(new T.CircleGeometry(2.6, 48), new T.MeshLambertMaterial({ map: gtex, color: 0x806868 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const key = new T.DirectionalLight(0xffa060, 1.7); key.position.set(-2.4, 1.3, 2.6); scene.add(key);   // first: drives the skin highlight
  const fill = new T.DirectionalLight(0x6a5cff, 0.45); fill.position.set(2.6, 1.0, 1.2); scene.add(fill);
  const rim = new T.DirectionalLight(0xff7a50, 2.2); rim.position.set(0.8, 2.2, -3.0); scene.add(rim);
  scene.add(new T.HemisphereLight(0x5a3a6a, 0x1a0c0a, 0.3));

  const camera = new T.PerspectiveCamera(32, 16 / 9, 0.05, 100);
  const models = {}; let current = [];
  const info = document.getElementById('info');
  function get(id) { if (!models[id]) models[id] = CT.heroines.build(id); return models[id]; }
  window.show = function (o) {
    current.forEach(m => scene.remove(m)); current = [];
    const ids = o.lineup ? CT.heroines.IDS : [o.id || 'kaela'];
    ids.forEach((id, i) => { const m = get(id); m.position.set(o.lineup ? (i - 1) * 1.05 : 0, 0, 0); m.rotation.y = -(o.angle || 0) * Math.PI / 180; scene.add(m); current.push(m); });
    if (o.lineup) { camera.position.set(0, 1.05, 6.4); camera.lookAt(0, 0.98, 0); }
    else if (o.zoom === 'close') { camera.position.set(0, 1.56, 1.75); camera.lookAt(0, 1.47, 0); }
    else { camera.position.set(0, 1.0, 3.75); camera.lookAt(0, 0.96, 0); }
    ground.visible = true; window.__turn = !!o.turn; window.__ang = o.angle || 0;
    info.textContent = current.map(m => { const s = m.userData.stats; return `${m.userData.id}: ${s.tris.total} tris (${JSON.stringify(s.tris)}), ${s.draws} meshes, built ${s.ms.toFixed(0)} ms`; }).join('\n');
    if (Q.get('noinfo') === '1') info.style.display = 'none';
  };
  let t = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    if (window.__turn) { window.__ang += dt * 30; current.forEach(m => { m.rotation.y = -window.__ang * Math.PI / 180; }); }
    current.forEach(m => m.userData.update(dt, t));
    postMat.uniforms.uTime.value = t;
    renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    requestAnimationFrame(frame);
  }
  window.show({ id: Q.get('id') || 'kaela', angle: +(Q.get('angle') || 0), turn: Q.get('turn') === '1', lineup: Q.get('lineup') === '1', zoom: Q.get('zoom') || 'full' });
  window.cam = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); camera.lookAt(tx, ty, tz); };
  window.__ready = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
